<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Birthday 🎬</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to top,#fbc2eb,#a6c1ee);
}

/* SCREENS */
.scene {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  transition:1s;
}
.hide { opacity:0; pointer-events:none; }

/* CARD */
.card {
  background:white;
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
  animation: zoom 1s;
}

@keyframes zoom {
  from {transform:scale(0.6); opacity:0;}
  to {transform:scale(1); opacity:1;}
}

h1 { color:#ff4d6d; }

/* CLASSROOM BG */
.classroom {
  background: url('class2.jfif') center/cover no-repeat;
}

/* CHARACTERS */
.row {
  display:flex;
  gap:50px;
}

.avatar {
  width:130px;
  height:130px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:70px;
  background:white;
  animation: bounce 1s infinite alternate;
}

@keyframes bounce {
  from {transform:translateY(0);}
  to {transform:translateY(-8px);}
}

/* SPEECH */
.bubble {
  background:white;
  padding:10px 15px;
  border-radius:20px;
  margin-top:10px;
  animation: float 1s infinite alternate;
}

@keyframes float {
  from {transform:translateY(0);}
  to {transform:translateY(-5px);}
}

/* BUTTON */
button {
  padding:12px 25px;
  border:none;
  border-radius:25px;
  margin:10px;
  cursor:pointer;
  font-size:16px;
}

.yes { background:#ff4d6d; color:white; }
.no { background:#ccc; position:absolute; }

/* PHOTO */
.photo {
  width:220px;
  border-radius:15px;
  opacity:0;
  transform:scale(0.8);
  transition:1s;
}
.show {
  opacity:1;
  transform:scale(1);
}

/* HEARTS */
.heart {
  position:absolute;
  color:red;
  font-size:20px;
  animation: floatUp 3s linear infinite;
}

@keyframes floatUp {
  to { transform: translateY(-100vh); opacity:0; }
}

/* CONFETTI */
.confetti {
  position:absolute;
  width:10px;
  height:10px;
  top:-10px;
  animation:fall linear infinite;
}
@keyframes fall {
  to { transform:translateY(100vh) rotate(360deg); }
}

</style>
</head>

<body>

<!-- SCENE 1 -->
<div class="scene" id="s1">
  <div class="card">
    <h1>HEYYY!! 😏</h1>
    <p>I made something for you 💖</p>
    <button class="yes" onclick="scene2()">Start</button>
  </div>
</div>

<!-- SCENE 2 -->
<div class="scene classroom hide" id="s2">
  <div class="row">
    <div>
      <div class="avatar">💁‍♀️</div>
      <div class="bubble" id="talk">broooo😭</div>
    </div>

    <div>
      <div class="avatar">🙎‍♀️</div>
	
      <div class="bubble">Acha mgh</div>
    </div>
  </div>
</div>

<!-- SCENE 3 -->
<div class="scene hide" id="s3">
  <h1>Wanna see surprise? 😏</h1>
  <button class="yes" onclick="scene4()">YES</button>
  <button class="no" id="noBtn">NO</button>
</div>

<!-- SCENE 4 -->
<div class="scene hide" id="s4">
  <h1>For You 💖</h1>
  <img src="t1.jpeg" class="photo" id="img">
  <p id="msg"></p>
</div>

<!-- SCENE 5 -->
<div class="scene hide" id="s5">
  <h1>HAPPIEST BIRTHDAY 🎂✨</h1>
  <p>My first 11th class friend you mean alot to me 🫂</p>
</div>

<script>

/* SCENE FLOW */
function scene2(){
  s1.classList.add("hide");
  s2.classList.remove("hide");

  let lines = [
    "broo ata tii ashi bolli yarr",
    "ani tula mahit ahe ",
    "mala he sagla nahi avadat",
    "sod chal jaude tu bol"
  ];

  let i=0;
  let int=setInterval(()=>{
    talk.innerText = lines[i];
    i++;
    if(i==lines.length){
      clearInterval(int);
      setTimeout(()=>{
        s2.classList.add("hide");
        s3.classList.remove("hide");
      },1500);
    }
  },1500);
}

/* NO BUTTON CHAOS */
noBtn.onmouseover = ()=>{
  noBtn.style.left=Math.random()*80+"%";
  noBtn.style.top=Math.random()*80+"%";
};

/* SCENE 4 */
function scene4(){
  s3.classList.add("hide");
  s4.classList.remove("hide");

  setTimeout(()=>{
    img.classList.add("show");
    msg.innerText="Every moment with you was magic the masti and unbeatable laughing at the last bench i still miss those days💖";
  },1000);

  setTimeout(()=>{
    s4.classList.add("hide");
    s5.classList.remove("hide");
    effects();
  },4000);
}

/* EFFECTS */
function effects(){
  // hearts
  setInterval(()=>{
    let h=document.createElement("div");
    h.classList.add("heart");
    h.innerText="💖";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
  },300);

  // confetti
  for(let i=0;i<70;i++){
    let c=document.createElement("div");
    c.classList.add("confetti");
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ff4d6d","#ffd6a5","#caffbf"][Math.floor(Math.random()*3)];
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
  }
}

</script>

</body>
</html>
